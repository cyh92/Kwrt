#=================================================
# Manual Build — 手动选择源码/分支/设备进行编译并发布 Release
# 说明:
#   - 手动触发(workflow_dispatch)
#   - 输入: 源码仓库地址、分支、目标平台、设备(dts)
#   - 将 devices/<target>/.../dts/<device>.dts 注入 openwrt 源码并注册 Device 块
#   - make menuconfig/defconfig 可识别该设备
#   - 编译完成后自动发布固件到 GitHub Release
#=================================================

name: Manual Build Firmware

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'OpenWrt 源码仓库地址'
        required: true
        default: 'https://github.com/openwrt/openwrt'
        type: string
      repo_branch:
        description: '源码分支 / Tag'
        required: true
        default: 'openwrt-25.12'
        type: string
      target:
        description: '目标平台 (devices/ 下)'
        required: true
        default: 'mediatek_filogic'
        type: choice
        options:
          - mediatek_filogic
          - ramips_mt7621
          - qualcommax_ipq50xx
          - qualcommax_ipq60xx
          - qualcommax_ipq807x
          - amlogic_meson8b
          - x86_64
          - x86_generic
          - rockchip_armv8
          - bcm27xx_bcm2712
          - bcm27xx_bcm2711
          - bcm27xx_bcm2710
          - bcm27xx_bcm2709
          - bcm27xx_bcm2708
          - armsr_armv8
          - mediatek_mt7622
          - ipq40xx_generic
          - ipq806x_generic
          - mvebu_cortexa9
          - bcm53xx
          - sunxi_cortexa53
          - sunxi_cortexa7
          - ath79_nand
          - amlogic_meson
          - airoha_an7581
          - siflower_sf21
      device:
        description: '要编译的设备 (对应 dts 文件名, 不含 .dts)'
        required: true
        default: 'mt7981b-cmcc-rax3000m-nand'
        type: choice
        options:
          # mediatek_filogic
          - mt7981b-aigo-ags21
          - mt7981b-cmcc-a10
          - mt7981b-cmcc-mr3000d-ciq-256m
          - mt7981b-cmcc-rax3000m-emmc
          - mt7981b-cmcc-rax3000m-nand
          - mt7981b-cmcc-xr30-emmc
          - mt7981b-cmcc-xr30
          - mt7981b-cudy-tr3000-mod
          - mt7981b-ikuai-q3000
          - mt7981b-konka-komi-a31
          - mt7981b-newland-nl-wr8103
          - mt7981b-nradio-c8-660
          - mt7981b-philips-hy3000
          - mt7981b-sl-3000-emmc
          - mt7981b-sl-3000
          - mt7981b-umi-uax3000e
          - mt7981b-xiaomi-mi-router-wr30u
          - mt7987a-glinet-gl-mt3600be
          # ramips_mt7621
          - mt7621_ht-jsh_0211
          - mt7621_zte_e8820s
          - mt7621_zte_e8820v2
          # qualcommax_ipq50xx
          - ipq5018-re-cs-03
          # qualcommax_ipq60xx
          - ipq6010-ly1800
          # qualcommax_ipq807x
          - ipq8071-ax3600
          - ipq8071-ax6
          - ipq8072-ax9000
          # amlogic_meson8b
          - meson8b-onecloud
      image_size:
        description: '固件分区大小 (默认 65536k = 64MB)'
        required: false
        default: '65536k'
        type: string

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ github.event.inputs.device }} on ${{ github.event.inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Clone source
        run: |
          git clone "${{ github.event.inputs.repo_url }}" -b "${{ github.event.inputs.repo_branch }}" openwrt || git clone "${{ github.event.inputs.repo_url }}" openwrt

      - name: Copy custom configuration & diy
        run: |
          # 复制公共配置与 diy 到 openwrt
          cp -rf devices/common/. openwrt/
          if [ -d "devices/${{ github.event.inputs.target }}" ]; then
            cp -rf devices/${{ github.event.inputs.target }}/. openwrt/
          fi
          cp -rf devices openwrt/
          cd openwrt
          # 执行公共 diy (注入 TARGET 环境变量)
          TARGET=${{ github.event.inputs.target }} bash devices/common/diy.sh || true
          if [ -f "devices/${{ github.event.inputs.target }}/diy.sh" ]; then
            bash devices/${{ github.event.inputs.target }}/diy.sh || true
          fi
          # 将 diy 目录覆盖到源码根 (含 dts / files / patches)
          cp -Rf ./diy/* ./ || true

      - name: Inject custom dts device
        run: |
          bash scripts/add-device.sh \
            "${{ github.event.inputs.target }}" \
            "${{ github.event.inputs.device }}" \
            "$GITHUB_WORKSPACE/openwrt" \
            "${{ github.event.inputs.image_size }}"

      - name: Defconfig
        run: |
          cd openwrt
          # 组装 .config: 公共配置 → target 配置 → 设备启用
          cp -f devices/common/.config .config
          if [ -f "devices/${{ github.event.inputs.target }}/.config" ]; then
            echo >> .config
            cat devices/${{ github.event.inputs.target }}/.config >> .config
          fi
          # 追加设备启用配置 (由 add-device.sh 输出的片段)
          PLATFORM=$(grep -E "^${{ github.event.inputs.target }}\|" $GITHUB_WORKSPACE/scripts/devices.conf | cut -d'|' -f2)
          SUBTARGET=$(grep -E "^${{ github.event.inputs.target }}\|" $GITHUB_WORKSPACE/scripts/devices.conf | cut -d'|' -f5)
          CFG_DEVICE=$(echo "${{ github.event.inputs.device }}" | tr '.-' '__')
          {
            echo "CONFIG_TARGET_${PLATFORM}=y"
            echo "CONFIG_TARGET_${PLATFORM}_${SUBTARGET}=y"
            echo "CONFIG_TARGET_${PLATFORM}_${SUBTARGET}_DEVICE_${CFG_DEVICE}=y"
            echo "CONFIG_TARGET_ALL_PROFILES=n"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
          } >> .config
          make defconfig
          echo "===== 设备识别检查 ====="
          grep -E "CONFIG_TARGET_.*DEVICE.*=y" .config || true
          if grep -q "CONFIG_TARGET_${PLATFORM}_${SUBTARGET}_DEVICE_${CFG_DEVICE}=y" .config; then
            echo "✓ 设备 ${{ github.event.inputs.device }} 已被 menuconfig/defconfig 识别"
          else
            echo "⚠ 未在 .config 中找到该设备, 请检查 devices.conf 与 image/*.mk 注册"
          fi

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(($(nproc)+1)) thread compile"
          make -j$(($(nproc)+1)) || { log=$(mktemp); make V=s &>$log; } || { tail -50 $log; exit 1; }
          df -hT

      - name: Organize files
        id: organize
        continue-on-error: true
        run: |
          cd openwrt/bin/targets/*/*/
          cp $GITHUB_WORKSPACE/openwrt/.config ${{ github.event.inputs.target }}.config || true
          ls -la

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@master
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "${{ github.event.inputs.device }}_${{ github.run_number }}"
          name: "${{ github.event.inputs.device }} on ${{ github.event.inputs.target }} (手动编译)"
          body: |
            ## 手动编译固件
            - 源码: `${{ github.event.inputs.repo_url }}` @ `${{ github.event.inputs.repo_branch }}`
            - 平台: `${{ github.event.inputs.target }}`
            - 设备: `${{ github.event.inputs.device }}`
            - 触发: GitHub Actions workflow_dispatch
          files: |
            openwrt/bin/targets/
      - name: Upload artifacts (backup)
        if: steps.create_release.outcome == 'failure'
        uses: actions/upload-artifact@main
        with:
          name: ${{ github.event.inputs.device }}
          path: |
            openwrt/bin/targets/
